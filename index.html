<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CapCut Editz Packs</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
background:linear-gradient(180deg,#000,#111,#000);
color:#fff;
min-height:100vh;
overflow-x:hidden;
}

header{
padding:40px 20px;
text-align:center;
}

header h1{
font-size:38px;
font-weight:700;
}

header p{
opacity:.7;
margin-top:10px;
}

.search{
width:90%;
max-width:500px;
margin:20px auto;
display:block;
padding:15px;
border:none;
outline:none;
border-radius:15px;
background:#1b1b1b;
color:white;
font-size:16px;
}

.container{
width:92%;
max-width:700px;
margin:auto;
padding-bottom:60px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:20px;
margin-bottom:20px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
margin-bottom:10px;
}

.card p{
opacity:.8;
margin-bottom:20px;
}

.download{
display:block;
text-align:center;
padding:15px;
border-radius:14px;
text-decoration:none;
background:white;
color:black;
font-weight:bold;
transition:.3s;
}

.download:hover{
transform:scale(1.03);
}

footer{
text-align:center;
padding:30px;
opacity:.6;
font-size:14px;
}

</style>
</head>

<body>

<header>

<h1>CapCut Editz Packs</h1>

<p>Packs gratuitos para editores.</p>

</header>

<input
class="search"
placeholder="Pesquisar packs..."
id="search">

<div class="container" id="packs">

<div class="card">

<h2>🚗 Car Clips 4K</h2>

<p>Pack gratuito de clips de carros em alta qualidade para edits.</p>

<a
class="download"
target="_blank"
href="https://www.mediafire.com/file/a4jsp4lur3su2v8/1_1_Stretched_Car_Clips_for_Edits_4K_free_to_use_No_Filters_Reupload_with_more_Clips%2528360P%2529.mp4/file">

⬇ Download

</a>

</div>

</div>

<footer>

© 2026 CapCut Editz Packs

</footer>

<script>

const search=document.getElementById("search");

search.onkeyup=()=>{

let value=search.value.toLowerCase();

document.querySelectorAll(".card").forEach(card=>{

card.style.display=
card.innerText.toLowerCase().includes(value)
?"block":"none";

});

}

</script>

</body>
</html>
